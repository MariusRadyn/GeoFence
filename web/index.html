<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Limitless IOT reports and tracking summaries">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Limitless IOT">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Limitless IOT</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Account deletion pages live on a separate site (no Flutter service worker). -->
  <script>
    (function () {
      var accountHost = 'https://limitless-iot-account.web.app';
      var path = location.pathname;
      if (path.slice(-16) === 'delete-data.html') {
        window.__skipFlutter = true;
        location.replace(accountHost + '/delete-data.html');
      } else if (path.slice(-19) === 'delete-account.html') {
        window.__skipFlutter = true;
        location.replace(accountHost + '/delete-account.html');
      } else if (path.slice(-12) === 'privacy.html') {
        window.__skipFlutter = true;
        location.replace(accountHost + '/privacy.html');
      } else if (path.slice(-10) === 'terms.html') {
        window.__skipFlutter = true;
        location.replace(accountHost + '/terms.html');
      } else if (path.slice(-13) === 'warranty.html') {
        window.__skipFlutter = true;
        location.replace(accountHost + '/warranty.html');
      }
    })();
  </script>

  <!-- App Check: use the SAME debug token already registered in Firebase Console
       (App Check → Web app → Manage debug tokens). `true` can mint a new token. -->
  <script>
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = '1d08c0a0-4b92-4339-8cff-3d0de61304e7';
    }
  </script>
  <script>
    if (!window.__skipFlutter) {
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
